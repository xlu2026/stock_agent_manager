# 固定工作区：无论从哪个 cwd 启动，都只能在这个根下读写
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: 'C:/AI_workspace/stock_agent_manager'
    additionalWritableRoots: !!js ctx.headlessStartup.additionalWritableRoots

- insert:
    - id: mcp-data
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: data
        transport: stdio
        command: python
        args:
          - '-m'
          - 'quant.data_mcp'
        cwd: 'C:/AI_workspace/stock_agent_manager'
        failOnStartupError: true
        toolCallTimeoutMs: 120000
